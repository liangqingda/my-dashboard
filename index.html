<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 在样式和 React 加载前恢复主题，使用 Mantine 默认存储键和浅色回退。
      (() => {
        let scheme = 'light';
        try {
          const saved = localStorage.getItem('mantine-color-scheme-value');
          if (saved === 'dark' || saved === 'light') {
            scheme = saved;
          } else if (saved === 'auto') {
            scheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
        } catch {
          // 浏览器禁用存储时保持默认浅色主题。
        }
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
      })();
    </script>
    <style>
      html { background: #f3f6f4; color-scheme: light; }
      html[data-mantine-color-scheme='dark'] { background: #0f1513; color-scheme: dark; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="My Dashboard — 关注信息的个人工作台" />
    <title>My Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
